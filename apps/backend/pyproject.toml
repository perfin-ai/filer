[project]
name = "filer-backend"
version = "0.1.0"
description = "Filer indexing / filing / assistant backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "celery>=5.4",
    "sse-starlette>=2.1",
    "platformdirs>=4.3",
    "pydantic-settings>=2.14.1",
    "fastembed>=0.8.0",
    "pypdfium2>=5.9.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "lancedb>=0.33.0",
    "pydantic-ai>=1.106.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["filer_backend"]
